<!DOCTYPE html>
<html>
    <head>
        <title>table task 3</title>
        <style>
            table,tr,th{
                border: 2px solid black;

            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th>Quicks</th>
                <th colspan="3">brown fox</th>
                <th>jumps</th>
            </tr>
            <tr>
                <th rowspan="3">Over the</th>
                <th colspan="2">lazy</th> 
                <th>dog</th>
                <th>and</th> 
                
            </tr>
            <th>then</th>
            <th colspan="2">it</th>
            <th colspan="2">fall</th>
              
            <tr>
                <th colspan="4">prey to a lion</th>
            </tr>
        </table>
    </body>
</html>
