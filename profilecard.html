<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        .box{
            margin-top: 20px;
            padding:15px;
            background-color:rgb(187, 221, 250);
            border-radius: 20px;
            
        }
        .head{
            border:5px soild black;
            background-color: rgb(83, 80, 248);
            padding:5px;
            text-align: center;
            color:white;
            border-radius: 20px;
        }
        .aboutbox{
            margin-top: 30px;
            background-color: white;
            border:2px solid whitesmoke;
            border-radius:15px;
            padding:20px;
        }
        #para1{
            color:blue;
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
        }
        #para2{
            font-size:15px;
        }
        .box2{
            width:50px;
            padding:10px;
            background-color:rgb(207, 243, 243);
            color:rgb(11, 11, 239);
            border-radius: 10px;
        }
        .box3{
            width:50px;
            padding:10px;
            text-align: center;
            background-color:rgb(147, 228, 147);
            border-radius:20px;
        }
        .footer{
            width:50%;
            color:blue;
            margin-left:20%;
            padding:10px;
            text-align:center;
            background-color:aliceblue;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="head">
            <h1>WELCOME</h1>
            <h2>I'm Danusree</h2>
            <h3>Aspiring MERN Developer</h3>
        </div>
        <div class="aboutbox">
            <div class="about">
                <p id="para1">About Me<p>
                <p id="para2">Hello! Iam learning HTML and CSS</p>
                <hr>
                <p id="para1">My Skills<p></p>
                <p class="box2">HTML</p>
                <p class="box3">CSS</p>
            </div>
            <div class="footer">
            <h3>Keep Learning!</h3>
            <p>Every day is a new Opportunity.</p>
        </div>
        </div>
        
        
    </div>
</body>
</html>
