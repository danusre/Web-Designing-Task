<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        h1{
            color: rgb(190, 6, 231);
        }
        fieldset{
            background-color: blueviolet;
            color: white;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            border: 2px solid black;
        }
       
    </style>
</head>
<body>
    <h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;STUDENT REGISTRATION FORM</h1>
    
        <form action="/HTML/firstpage.html" target="_blank">
        <fieldset>
            <br>
            <label for="fname">FIRST NAME</label>
            <input type="text" id="fname" name="fname" maxlength="30"><label> (max 30 charcters a-z and A-Z)</label>
            <br><br>
            <label for="lname">LAST NAME</label>
            <input type="text" id="lname" name="lname" maxlength="30"><label> (max 30 chacters a-z and A-Z)</label>
            <br><br>
            <label for="dob">DATE OF BIRTH</label>
            <select name="dob" id="dob">
                <option value="1">Day</option>
                <option value="1">1</option>
                <option value="1">2</option>
                <option value="1">3</option>
            </select>
            <select name="dob" id="dob">
                <option value="1">Month</option>
                <option value="1">January</option>
                <option value="1">February</option>
                <option value="1">March</option>
            </select>
            <select name="dob" id="dob">
                <option value="1">Year</option>
                <option value="1">2000</option>
                <option value="1">2001</option>
                <option value="1">2002</option>
            </select>
            <br><br>
            <label for="email">EMAIL ID</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="phone">MOBILE NUMBER</label>
            <input type="tel" id="phone" name="phone" max="10"><label> (10 digit number)</label>
            <br><br>
            <label for="radio">GENDER</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            <label for="adds">ADDRESS</label>
            <textarea type="address" id="adds" name="adds" rows="3" cols="30"></textarea>
            <br><br>
            <lable for="city">CITY</lable>
            <input type="text" id="city" name="city" max="30"><label> (max 30 character a-z and A-Z)</label>
            <br><br>
            <label for="pin">PIN CODE</label>
            <input type="number" id="pin" name="pin" maxlength="6"><label> (6 digit nubmer)</label>
            <br><br>
            <label for="state">STATE</label>
            <input type="text" id="state" name="state" max="30"><label> (max 30 character a-z and A-Z)</label>
            <br><br>
            <label for="country">COUNTRY</label>
            <input type="text" id="country" name="country" placeholder="India">
            <br><br>
            <label for="hob">HOBBIES</label>
            <input type="checkbox">Singing
            <input type="checkbox">Dancing
            <input type="checkbox">Sketching
            <input type="checkbox">others
            <input type="checkbox"><input type="text" id="hob" name="hob">
            <br><br>
            <label for="qual">QUALIFICATION</label>
            <table>
                <tr>
                    <th>SI.NO</th>
                    <th>Examination</th>
                    <th><label for="bod">Board</label></th>
                    <th><label for="per">Percentage</label></th>
                    <th><label for="yea">Year of Passing</label></th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Class X</td>
                    <td><input type="text" id="bod" name="bod" max="10"></td>
                    <td><input type="number" id="per" name="per"></td>
                    <td><input type="number" id="yea" name="yea"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Class XII</td>
                    <td><input type="text" id="bod" name="bod" max="10"></td>
                    <td><input type="number" id="per" name="per"></td>
                    <td><input type="number" id="yea" name="yea"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Graduation</td>
                    <td><input type="text" id="bod" name="bod" max="10"></td>
                    <td><input type="number" id="per" name="per"></td>
                    <td><input type="number" id="yea" name="yea"></td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Masters</td>
                    <td><input type="text" id="bod" name="bod" max="10"></td>
                    <td><input type="number" id="per" name="per"></td>
                    <td><input type="number" id="yea" name="yea"></td>
                </tr>  
            </table>
            <table>
                <tr  >
                   <td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(10 char max)</td>
                    <td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(upto 2 decimal) </td>

                </tr>
            </table>
            <br><br>
            <label for="course">COURSE<br>APPLIED FOR</label>
            <input type="radio" name="course">BCA
            <input type="radio" name="course">B.com
            <input type="radio" name="course">B.sc
            <input type="radio" name="course">B.A
            <input type="radio" name="course">
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            </fieldset>
        </form>
    
</body>
</html>
